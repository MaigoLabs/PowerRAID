# PowerRAID ESP32-S3 Firmware Configuration
# SPDX-License-Identifier: Apache-2.0

[platformio]
name = powerraid_firmware
description = PowerRAID V2 Embedded Controller Firmware
default_envs = powerraid_firmware

[env:powerraid_firmware]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 921600
extra_scripts = pre:scripts/embed_pramon.py
custom_pramon_version = 0.8.3
custom_pramon_protocol = 6
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D PRAMON_FW_VERSION="0.8.3"
  -D PRAMON_PROTOCOL_VERSION=6
